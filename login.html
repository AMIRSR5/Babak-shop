<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ورود / ثبت‌نام - آرایشی بهداشتی بابک</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing:border-box; }
html,body{ margin:0; direction:rtl; font-family:"Vazirmatn",Tahoma,sans-serif; }
body{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background: linear-gradient(160deg,#0f3d3e,#134e4a,#0c2e2f);
}
a{ text-decoration:none; }
button{ font-family:inherit; cursor:pointer; border:none; }
input{ font-family:inherit; }

.back-home{
  position:fixed; top:16px; right:16px; color:#fff; opacity:.8; font-size:13px; font-weight:600;
  background:rgba(255,255,255,.12); padding:7px 14px; border-radius:999px;
}

.auth-card{
  width:100%; max-width:380px; background:rgba(255,255,255,.06); backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.1); border-radius:28px; padding:28px 24px; box-shadow:0 20px 50px rgba(0,0,0,.35);
}

/* ---------- Bear ---------- */
.bear-wrap{ width:150px; height:150px; margin:0 auto 6px; position:relative; }
.bear-ear{ position:absolute; top:2px; width:38px; height:38px; background:#fff; border-radius:50%; }
.bear-ear.left{ left:6px; } .bear-ear.right{ right:6px; }
.bear-ear::after{ content:''; position:absolute; inset:9px; background:#fbcfe8; border-radius:50%; }
.bear-head{
  position:absolute; top:22px; left:50%; transform:translateX(-50%);
  width:120px; height:104px; background:#fff; border-radius:50% 50% 46% 46%;
}
.bear-eye{
  position:absolute; top:40px; width:16px; height:16px; background:#2b2b33; border-radius:50%;
}
.bear-eye.left{ left:26px; } .bear-eye.right{ right:26px; }
.bear-blush{ position:absolute; top:62px; width:16px; height:9px; background:#fbcfe8; border-radius:50%; opacity:.8; }
.bear-blush.left{ left:14px; } .bear-blush.right{ right:14px; }
.bear-snout{
  position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
  width:34px; height:22px; background:#fdf2f8; border-radius:50%;
}
.bear-snout::after{
  content:''; position:absolute; top:5px; left:50%; transform:translateX(-50%);
  width:9px; height:7px; background:#2b2b33; border-radius:50%;
}
.bear-paw{
  position:absolute; top:22px; width:46px; height:46px; background:#fff; border-radius:46% 46% 50% 50% / 60% 60% 40% 40%;
  transform:translateY(-90px); transition:transform .35s cubic-bezier(.34,1.4,.64,1); z-index:3;
  box-shadow:0 4px 10px rgba(0,0,0,.12);
}
.bear-paw::before, .bear-paw::after{ content:''; position:absolute; top:-6px; width:12px; height:14px; background:#fff; border-radius:50%; }
.bear-paw::before{ left:6px; } .bear-paw::after{ right:6px; }
.bear-paw.left{ left:8px; } .bear-paw.right{ right:8px; }
.bear-wrap.covering .bear-paw.left{ transform:translateY(28px) rotate(-6deg); }
.bear-wrap.covering .bear-paw.right{ transform:translateY(28px) rotate(6deg); }

.auth-title{ text-align:center; color:#fff; font-weight:800; font-size:20px; margin:8px 0 2px; }
.auth-sub{ text-align:center; color:rgba(255,255,255,.6); font-size:12.5px; margin:0 0 20px; }

.field-wrap{ position:relative; margin-bottom:12px; }
.field{
  width:100%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:#fff;
  border-radius:14px; padding:13px 42px 13px 14px; font-size:14px;
}
.field::placeholder{ color:rgba(255,255,255,.45); }
.field:focus{ outline:none; border-color:#5eead4; }
.field-icon{ position:absolute; top:50%; right:14px; transform:translateY(-50%); opacity:.6; }
.eye-toggle{
  position:absolute; top:50%; left:12px; transform:translateY(-50%); background:none; color:rgba(255,255,255,.6); font-size:16px;
}

.err-text{ color:#fca5a5; font-size:12.5px; text-align:center; margin:0 0 8px; }
.ok-text{ color:#5eead4; font-size:12.5px; text-align:center; margin:0 0 8px; }
.order-notice{ background:rgba(94,234,212,.12); border:1px solid rgba(94,234,212,.3); color:#5eead4; font-size:12px; text-align:center; padding:8px 10px; border-radius:12px; margin-bottom:14px; }

.submit-btn{
  width:100%; border-radius:14px; padding:13px; font-weight:700; color:#0c2e2f; font-size:14.5px;
  background: linear-gradient(90deg,#5eead4,#a78bfa); margin-top:4px;
}
.submit-btn:disabled{ opacity:.6; }
.switch-link{ display:block; text-align:center; color:rgba(255,255,255,.65); font-size:12.5px; margin-top:16px; background:none; width:100%; }
.switch-link b{ color:#5eead4; }
</style>
</head>
<body>

<a href="index.html" class="back-home">🏠 بازگشت به سایت</a>

<div class="auth-card">
  <p class="order-notice" id="orderNotice" style="display:none;">برای ثبت سفارش، ابتدا وارد حساب کاربری خود شوید</p>
  <div class="bear-wrap" id="bearWrap">
    <div class="bear-ear left"></div>
    <div class="bear-ear right"></div>
    <div class="bear-head">
      <div class="bear-eye left"></div>
      <div class="bear-eye right"></div>
      <div class="bear-blush left"></div>
      <div class="bear-blush right"></div>
      <div class="bear-snout"></div>
    </div>
    <div class="bear-paw left"></div>
    <div class="bear-paw right"></div>
  </div>

  <h1 class="auth-title" id="authTitle">Welcome Back</h1>
  <p class="auth-sub" id="authSub">وارد حساب کاربری خود شوید</p>

  <div id="stepCreds">
    <div class="field-wrap">
      <input class="field" id="authEmail" type="email" placeholder="ایمیل" dir="ltr" autocomplete="email">
      <span class="field-icon">✉️</span>
    </div>
    <div class="field-wrap">
      <input class="field" id="authPass" type="password" placeholder="رمز عبور" dir="ltr" autocomplete="current-password">
      <button type="button" class="eye-toggle" id="eyeToggle">👁️</button>
    </div>
  </div>

  <div id="stepVerify" style="display:none;">
    <div class="field-wrap">
      <input class="field" id="otpCode" placeholder="کد تایید" inputmode="numeric" dir="ltr" style="text-align:center; letter-spacing:4px; font-size:18px;">
    </div>
  </div>

  <p class="err-text" id="authErr" style="display:none;"></p>
  <p class="ok-text" id="authOk" style="display:none;"></p>

  <button class="submit-btn" id="authBtn">ورود</button>
  <button class="switch-link" id="switchModeBtn">حساب ندارید؟ <b>ثبت‌نام کنید</b></button>
</div>

<script src="config.js"></script>
<script>
let mode = 'login'; // 'login' | 'signup'
let step = 'creds'; // 'creds' | 'verify'
let pendingSignupEmail = '';
if(sessionStorage.getItem('pendingOrder')){
  document.getElementById('orderNotice').style.display = 'block';
}
const bearWrap = document.getElementById('bearWrap');
const passField = document.getElementById('authPass');
const emailField = document.getElementById('authEmail');

passField.addEventListener('focus', ()=> bearWrap.classList.add('covering'));
passField.addEventListener('blur', ()=> bearWrap.classList.remove('covering'));
emailField.addEventListener('focus', ()=> bearWrap.classList.remove('covering'));

document.getElementById('eyeToggle').onclick = () => {
  passField.type = passField.type === 'password' ? 'text' : 'password';
};

document.getElementById('switchModeBtn').onclick = () => {
  if(step === 'verify'){
    step = 'creds';
    mode = 'signup';
    updateUI();
    return;
  }
  mode = mode === 'login' ? 'signup' : 'login';
  updateUI();
};

function updateUI(){
  const title = document.getElementById('authTitle');
  const sub = document.getElementById('authSub');
  const btn = document.getElementById('authBtn');
  const switchBtn = document.getElementById('switchModeBtn');
  document.getElementById('authErr').style.display = 'none';
  document.getElementById('authOk').style.display = 'none';

  if(step === 'verify'){
    document.getElementById('stepCreds').style.display = 'none';
    document.getElementById('stepVerify').style.display = 'block';
    title.textContent = 'تایید ایمیل';
    sub.textContent = `کد ارسال‌شده به ${pendingSignupEmail} را وارد کنید`;
    btn.textContent = 'تایید کد';
    switchBtn.innerHTML = 'بازگشت';
    return;
  }

  document.getElementById('stepCreds').style.display = 'block';
  document.getElementById('stepVerify').style.display = 'none';
  if(mode === 'signup'){
    title.textContent = 'Create Account';
    sub.textContent = 'یک حساب کاربری جدید بسازید';
    btn.textContent = 'ثبت‌نام';
    switchBtn.innerHTML = 'قبلاً حساب دارید؟ <b>وارد شوید</b>';
  } else {
    title.textContent = 'Welcome Back';
    sub.textContent = 'وارد حساب کاربری خود شوید';
    btn.textContent = 'ورود';
    switchBtn.innerHTML = 'حساب ندارید؟ <b>ثبت‌نام کنید</b>';
  }
}

document.getElementById('authBtn').onclick = async () => {
  const errEl = document.getElementById('authErr');
  const okEl = document.getElementById('authOk');
  errEl.style.display='none'; okEl.style.display='none';
  const btn = document.getElementById('authBtn');

  if(step === 'verify'){
    const token = document.getElementById('otpCode').value.trim();
    if(!token){ errEl.textContent = 'کد تایید را وارد کنید.'; errEl.style.display='block'; return; }
    btn.disabled = true; btn.textContent = 'در حال بررسی...';
    const { error } = await supabaseClient.auth.verifyOtp({ email: pendingSignupEmail, token, type:'signup' });
    btn.disabled = false; btn.textContent = 'تایید کد';
    if(error){ errEl.textContent = 'کد وارد شده نادرست یا منقضی شده است.'; errEl.style.display='block'; return; }
    okEl.textContent = 'خوش آمدید! در حال انتقال به سایت...';
    okEl.style.display='block';
    const redirectTo = new URLSearchParams(location.search).get('redirect') || 'index.html';
    setTimeout(()=>{ location.href = redirectTo; }, 1200);
    return;
  }

  const email = emailField.value.trim();
  const password = passField.value;
  if(!email || password.length < 6){
    errEl.textContent = 'ایمیل معتبر و رمز حداقل ۶ کاراکتری وارد کنید.';
    errEl.style.display='block';
    return;
  }

  btn.disabled = true; btn.textContent = 'در حال بررسی...';

  if(mode === 'login'){
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = 'ورود';
    if(error){ errEl.textContent = 'ایمیل یا رمز عبور اشتباه است.'; errEl.style.display='block'; return; }
    okEl.textContent = 'خوش آمدید! در حال انتقال به سایت...';
    okEl.style.display='block';
    const redirectTo = new URLSearchParams(location.search).get('redirect') || 'index.html';
    setTimeout(()=>{ location.href = redirectTo; }, 1200);
  } else {
    const { error } = await supabaseClient.auth.signUp({ email, password });
    btn.disabled = false; btn.textContent = 'ثبت‌نام';
    if(error){
      errEl.textContent = error.message && error.message.includes('already') ? 'این ایمیل قبلاً ثبت شده است.' : 'خطا در ثبت‌نام.';
      errEl.style.display='block';
      return;
    }
    pendingSignupEmail = email;
    step = 'verify';
    updateUI();
  }
};
</script>
</body>
</html>
