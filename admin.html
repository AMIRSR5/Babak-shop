<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>پنل مدیریت - آرایشی بهداشتی بابک</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing:border-box; }
html,body{ margin:0; direction:rtl; font-family:"Vazirmatn",Tahoma,sans-serif; background:#f9fafb; color:#374151; }
button{ font-family:inherit; cursor:pointer; border:none; }
input,textarea,select{ font-family:inherit; }
.center-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
.login-bg{ background:linear-gradient(135deg,#7c3aed,#ec4899,#f472b6); }
.login-card{ background:#fff; border-radius:24px; box-shadow:0 10px 30px rgba(0,0,0,.2); padding:32px; width:100%; max-width:380px; display:flex; flex-direction:column; gap:12px; }
.login-card h1{ text-align:center; color:#7c3aed; font-size:19px; margin:0 0 2px; }
.login-card .sub{ text-align:center; font-size:12px; color:#9ca3af; margin:-8px 0 8px; }
.field{ width:100%; border:1px solid #e5e7eb; border-radius:12px; padding:11px 14px; font-size:14px; }
.field:focus{ outline:none; border-color:#ec4899; }
.btn-main{ border-radius:12px; padding:12px; font-weight:700; color:#fff; background:linear-gradient(90deg,#ec4899,#9333ea); font-size:14px; }
.btn-main:disabled{ opacity:.5; }
.err-text{ color:#ef4444; font-size:13px; text-align:center; margin:0; }
.btn-google{
  display:flex; align-items:center; justify-content:center; gap:10px;
  border:1px solid #e5e7eb; border-radius:12px; padding:11px; font-size:13.5px; font-weight:700; color:#374151; background:#fff;
}
.btn-google:active{ background:#f9fafb; }
.or-divider{ display:flex; align-items:center; gap:10px; color:#9ca3af; font-size:12px; margin:2px 0; }
.or-divider::before, .or-divider::after{ content:''; flex:1; height:1px; background:#e5e7eb; }
.link-switch{ background:none; color:#7c3aed; font-size:12.5px; font-weight:600; text-align:center; padding:4px; margin-top:4px; }

/* ---------- Bear ---------- */
.bear-wrap{ width:130px; height:130px; margin:0 auto 6px; position:relative; }
.bear-ear{ position:absolute; top:2px; width:34px; height:34px; background:#fdf2f8; border:1px solid #fbcfe8; border-radius:50%; }
.bear-ear.left{ left:4px; } .bear-ear.right{ right:4px; }
.bear-ear::after{ content:''; position:absolute; inset:8px; background:#f9a8d4; border-radius:50%; }
.bear-head{
  position:absolute; top:20px; left:50%; transform:translateX(-50%);
  width:104px; height:90px; background:#fff; border:1px solid #fbcfe8; border-radius:50% 50% 46% 46%;
}
.bear-eye{ position:absolute; top:34px; width:14px; height:14px; background:#2b2b33; border-radius:50%; }
.bear-eye.left{ left:22px; } .bear-eye.right{ right:22px; }
.bear-blush{ position:absolute; top:54px; width:14px; height:8px; background:#fbcfe8; border-radius:50%; opacity:.8; }
.bear-blush.left{ left:12px; } .bear-blush.right{ right:12px; }
.bear-snout{
  position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
  width:30px; height:19px; background:#fdf2f8; border-radius:50%;
}
.bear-snout::after{
  content:''; position:absolute; top:4px; left:50%; transform:translateX(-50%);
  width:8px; height:6px; background:#2b2b33; border-radius:50%;
}
.bear-paw{
  position:absolute; top:20px; width:40px; height:40px; background:#fff; border:1px solid #fbcfe8;
  border-radius:46% 46% 50% 50% / 60% 60% 40% 40%;
  transform:translateY(-80px); transition:transform .35s cubic-bezier(.34,1.4,.64,1); z-index:3;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}
.bear-paw::before, .bear-paw::after{ content:''; position:absolute; top:-5px; width:10px; height:12px; background:#fff; border:1px solid #fbcfe8; border-radius:50%; }
.bear-paw::before{ left:5px; } .bear-paw::after{ right:5px; }
.bear-paw.left{ left:6px; } .bear-paw.right{ right:6px; }
.bear-wrap.covering .bear-paw.left{ transform:translateY(24px) rotate(-6deg); }
.bear-wrap.covering .bear-paw.right{ transform:translateY(24px) rotate(6deg); }

.admin-header{ background:linear-gradient(90deg,#9333ea,#ec4899,#7c3aed); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
.admin-header b{ font-size:15px; }
.admin-header .email{ font-size:11px; opacity:.8; direction:ltr; display:inline-block; }
.btn-out{ background:rgba(255,255,255,.15); color:#fff; border-radius:999px; padding:6px 14px; font-size:12px; }

.tabs{ background:#fff; border-bottom:1px solid #e5e7eb; display:flex; overflow-x:auto; position:sticky; top:0; z-index:5; }
.tab-btn{ flex-shrink:0; background:none; padding:12px 16px; font-size:13px; font-weight:700; color:#6b7280; border-bottom:2px solid transparent; }
.tab-btn.active{ color:#db2777; border-color:#ec4899; }
#pendingBadge{ color:#ef4444; font-weight:800; }

.wrap{ max-width:760px; margin:0 auto; padding:16px; }
.section-title{ color:#7c3aed; font-weight:800; margin:0 0 12px; }
.card-white{ background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:16px; margin-bottom:12px; }
.row-flex{ display:flex; gap:8px; }
.list-item{ display:flex; align-items:center; gap:10px; background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:10px 12px; margin-bottom:8px; }
.list-item img{ width:44px; height:44px; border-radius:10px; object-fit:cover; background:#fdf2f8; flex-shrink:0; }
.list-item .thumb-empty{ width:44px; height:44px; border-radius:10px; background:#fdf2f8; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.image-thumbs-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.thumb-chip{ position:relative; width:56px; height:56px; border-radius:10px; overflow:hidden; }
.thumb-chip img{ width:100%; height:100%; object-fit:cover; }
.thumb-chip button{ position:absolute; top:2px; left:2px; background:rgba(0,0,0,.55); color:#fff; width:18px; height:18px; border-radius:50%; font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center; }
.item-title{ font-weight:700; font-size:13.5px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-sub{ font-size:11.5px; color:#9ca3af; margin:2px 0 0; }
.link-btn{ background:none; font-size:12.5px; font-weight:600; flex-shrink:0; }
.link-purple{ color:#7c3aed; }
.link-red{ color:#ef4444; }
.muted{ color:#9ca3af; font-size:13px; }
.hint{ font-size:11.5px; color:#9ca3af; margin:-4px 0 8px; }
label.small{ font-size:12.5px; color:#6b7280; display:block; margin-bottom:4px; }
</style>
</head>
<body>

<div id="app"></div>

<script src="config.js"></script>
<script>
let currentSession = null;
let currentIsAdmin = false;
let activeTab = 'products';
let authMode = 'login'; // 'login' | 'signup' | 'verify'
let pendingSignupEmail = '';

async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentSession = session;
  if(session){ await checkAdmin(); }
  render();

  supabaseClient.auth.onAuthStateChange(async (_e, session) => {
    currentSession = session;
    if(session){ authMode = 'login'; await checkAdmin(); } else { currentIsAdmin = false; }
    render();
  });
}

async function checkAdmin(){
  const email = currentSession?.user?.email;
  if(!email){ currentIsAdmin=false; return; }
  const { data } = await supabaseClient.from('admin_users').select('email').eq('email', email).maybeSingle();
  currentIsAdmin = !!data;
}

function render(){
  const app = document.getElementById('app');
  if(!currentSession){ app.innerHTML = loginScreen(); attachLoginEvents(); return; }
  if(!currentIsAdmin){
    app.innerHTML = `<div class="center-screen"><div style="text-align:center"><p style="color:#ef4444;font-weight:700;">دسترسی غیرمجاز</p><p class="muted">این کاربر در فهرست مدیران سایت نیست.</p><button class="btn-out" style="margin-top:14px;color:#7c3aed;background:#fdf2f8;" onclick="supabaseClient.auth.signOut()">خروج</button></div></div>`;
    return;
  }
  app.innerHTML = adminShell();
  loadTab(activeTab);
  refreshPendingBadge();
}

// ---------- LOGIN ----------
const bearHtml = `
  <div class="bear-wrap" id="bearWrap">
    <div class="bear-ear left"></div>
    <div class="bear-ear right"></div>
    <div class="bear-head">
      <div class="bear-eye left"></div>
      <div class="bear-eye right"></div>
      <div class="bear-blush left"></div>
      <div class="bear-blush right"></div>
      <div class="bear-snout"></div>
    </div>
    <div class="bear-paw left"></div>
    <div class="bear-paw right"></div>
  </div>`;

function loginScreen(){
  if(authMode==='signup') return signupScreenHtml();
  if(authMode==='verify') return verifyScreenHtml();
  return `
  <div class="center-screen login-bg">
    <div class="login-card">
      ${bearHtml}
      <h1>ورود به پنل مدیریت</h1>
      <p class="sub">آرایشی بهداشتی بابک</p>

      <button class="btn-google" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.94A9 9 0 0 0 0 9c0 1.45.35 2.83.94 4.03l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .94 4.97l3.01 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        ورود با حساب گوگل
      </button>
      <div class="or-divider"><span>یا</span></div>

      <input class="field" id="loginEmail" type="email" placeholder="ایمیل" dir="ltr" />
      <input class="field" id="loginPass" type="password" placeholder="رمز عبور" dir="ltr" />
      <p class="err-text" id="loginErr" style="display:none;"></p>
      <button class="btn-main" id="loginBtn">ورود</button>
      <button class="link-switch" id="toSignupBtn">حساب ندارید؟ ثبت‌نام کنید</button>
    </div>
  </div>`;
}

function signupScreenHtml(){
  return `
  <div class="center-screen login-bg">
    <div class="login-card">
      ${bearHtml}
      <h1>ساخت حساب جدید</h1>
      <p class="sub">بعد از ثبت‌نام، یک کد تایید به ایمیلتان ارسال می‌شود</p>
      <input class="field" id="suEmail" type="email" placeholder="ایمیل" dir="ltr" />
      <input class="field" id="suPass" type="password" placeholder="رمز عبور (حداقل ۶ کاراکتر)" dir="ltr" />
      <p class="err-text" id="suErr" style="display:none;"></p>
      <button class="btn-main" id="suBtn">ثبت‌نام و ارسال کد تایید</button>
      <button class="link-switch" id="toLoginBtn">قبلاً حساب دارید؟ ورود</button>
    </div>
  </div>`;
}

function verifyScreenHtml(){
  return `
  <div class="center-screen login-bg">
    <div class="login-card">
      <h1>تایید ایمیل</h1>
      <p class="sub">کد ارسال‌شده به ${pendingSignupEmail} را وارد کنید</p>
      <input class="field" id="otpCode" placeholder="کد تایید" inputmode="numeric" dir="ltr" style="text-align:center; letter-spacing:4px; font-size:18px;" />
      <p class="err-text" id="otpErr" style="display:none;"></p>
      <button class="btn-main" id="otpBtn">تایید کد</button>
      <button class="link-switch" id="backToSignup">بازگشت</button>
    </div>
  </div>`;
}

function attachBearEvents(passId, emailId){
  const bear = document.getElementById('bearWrap');
  const pass = document.getElementById(passId);
  const email = document.getElementById(emailId);
  if(!bear || !pass) return;
  pass.addEventListener('focus', ()=> bear.classList.add('covering'));
  pass.addEventListener('blur', ()=> bear.classList.remove('covering'));
  if(email) email.addEventListener('focus', ()=> bear.classList.remove('covering'));
}

function attachLoginEvents(){
  if(authMode==='signup') return attachSignupEvents();
  if(authMode==='verify') return attachVerifyEvents();

  attachBearEvents('loginPass','loginEmail');

  document.getElementById('googleBtn').onclick = async () => {
    await supabaseClient.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.href.split('?')[0] } });
  };
  document.getElementById('toSignupBtn').onclick = () => { authMode='signup'; render(); };

  document.getElementById('loginBtn').onclick = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginErr');
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'در حال ورود...';
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){ errEl.textContent = 'ایمیل یا رمز عبور اشتباه است.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='ورود'; }
  };
}

function attachSignupEvents(){
  attachBearEvents('suPass','suEmail');
  document.getElementById('toLoginBtn').onclick = () => { authMode='login'; render(); };
  document.getElementById('suBtn').onclick = async () => {
    const email = document.getElementById('suEmail').value.trim();
    const password = document.getElementById('suPass').value;
    const errEl = document.getElementById('suErr');
    errEl.style.display='none';
    if(!email || password.length<6){ errEl.textContent='ایمیل و رمز حداقل ۶ کاراکتری لازم است.'; errEl.style.display='block'; return; }
    const btn = document.getElementById('suBtn');
    btn.disabled=true; btn.textContent='در حال ارسال...';
    const { error } = await supabaseClient.auth.signUp({ email, password });
    btn.disabled=false; btn.textContent='ثبت‌نام و ارسال کد تایید';
    if(error){ errEl.textContent = error.message && error.message.includes('already') ? 'این ایمیل قبلاً ثبت شده است.' : 'خطا در ثبت‌نام.'; errEl.style.display='block'; return; }
    pendingSignupEmail = email;
    authMode = 'verify';
    render();
  };
}

function attachVerifyEvents(){
  document.getElementById('backToSignup').onclick = () => { authMode='signup'; render(); };
  document.getElementById('otpBtn').onclick = async () => {
    const token = document.getElementById('otpCode').value.trim();
    const errEl = document.getElementById('otpErr');
    errEl.style.display='none';
    if(!token){ errEl.textContent='کد تایید را وارد کنید.'; errEl.style.display='block'; return; }
    const btn = document.getElementById('otpBtn');
    btn.disabled=true; btn.textContent='در حال بررسی...';
    const { error } = await supabaseClient.auth.verifyOtp({ email: pendingSignupEmail, token, type:'signup' });
    btn.disabled=false; btn.textContent='تایید کد';
    if(error){ errEl.textContent='کد وارد شده نادرست یا منقضی شده است.'; errEl.style.display='block'; return; }
    // success — onAuthStateChange fires automatically and re-renders
  };
}

// ---------- ADMIN SHELL ----------
function adminShell(){
  const tabs = [
    ['products','🧴 محصولات'], ['categories','🗂️ دسته‌بندی‌ها'], ['orders','📦 سفارش‌ها'],
    ['comments','💬 نظرات'], ['admins','👤 مدیران'], ['settings','⚙️ تنظیمات']
  ];
  return `
    <div class="admin-header">
      <b>پنل مدیریت بابک</b>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="email">${currentSession.user.email}</span>
        <button class="btn-out" onclick="supabaseClient.auth.signOut()">خروج</button>
      </div>
    </div>
    <div class="tabs">
      ${tabs.map(([id,label])=>`<button class="tab-btn ${activeTab===id?'active':''}" onclick="switchTab('${id}')">${label}${id==='comments'?'<span id="pendingBadge"></span>':''}</button>`).join('')}
    </div>
    <div class="wrap" id="tabContent"></div>
  `;
}
function switchTab(id){ activeTab = id; document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); loadTab(id); render(); }

function loadTab(id){
  if(id==='products') return renderProducts();
  if(id==='categories') return renderCategories();
  if(id==='orders') return renderOrders();
  if(id==='comments') return renderComments();
  if(id==='admins') return renderAdmins();
  if(id==='settings') return renderSettings();
}

async function refreshPendingBadge(){
  const { count } = await supabaseClient.from('comments').select('*', { count:'exact', head:true }).eq('approved', false);
  const el = document.getElementById('pendingBadge');
  if(!el) return;
  el.textContent = count ? ` (${count})` : '';
}

// ---------- PRODUCTS ----------
let editingProduct = null;
let editingImages = [];
let categoriesCache = [];

async function renderProducts(){
  const el = document.getElementById('tabContent');
  el.innerHTML = `<h2 class="section-title">محصولات</h2>
    <button class="btn-main" style="margin-bottom:12px;" onclick="openProductForm(null)">+ محصول جدید</button>
    <div id="productFormWrap"></div>
    <div id="productListWrap" class="muted">در حال بارگذاری...</div>`;

  const [{data: prods}, {data: cats}] = await Promise.all([
    supabaseClient.from('products').select('*').order('created_at',{ascending:false}),
    supabaseClient.from('categories').select('*').order('created_at')
  ]);
  categoriesCache = cats || [];
  const listEl = document.getElementById('productListWrap');
  if(!prods || prods.length===0){ listEl.innerHTML = '<p class="muted">محصولی ثبت نشده.</p>'; return; }
  listEl.innerHTML = prods.map(p => `
    <div class="list-item">
      ${p.image_url ? `<img src="${p.image_url}">` : `<div class="thumb-empty">💄</div>`}
      <div style="flex:1; min-width:0;">
        <p class="item-title">${p.name}</p>
        <p class="item-sub">${Number(p.price).toLocaleString('fa-IR')} تومان${p.discount_price?` (تخفیف: ${Number(p.discount_price).toLocaleString('fa-IR')})`:''} · ${p.torob_link?'ترب فعال':'ترب غیرفعال'}${p.is_top?' · ⭐ ویژه':''}</p>
      </div>
      <button class="link-btn link-purple" onclick='openProductForm(${JSON.stringify(p)})'>ویرایش</button>
      <button class="link-btn link-red" onclick="deleteProduct('${p.id}')">حذف</button>
    </div>`).join('');
}

function openProductForm(product){
  editingProduct = product;
  editingImages = product ? (product.images && product.images.length ? [...product.images] : (product.image_url ? [product.image_url] : [])) : [];
  const catOptions = categoriesCache.map(c=>`<option value="${c.id}" ${product&&product.category_id===c.id?'selected':''}>${c.name}</option>`).join('');
  document.getElementById('productFormWrap').innerHTML = `
    <div class="card-white">
      <input class="field" id="pfName" placeholder="نام محصول" value="${product?product.name.replace(/"/g,'&quot;'):''}" style="margin-bottom:8px;">
      <textarea class="field" id="pfDesc" placeholder="توضیحات محصول" rows="3" style="margin-bottom:8px;">${product?product.description||'':''}</textarea>
      <div class="row-flex" style="margin-bottom:8px;">
        <input class="field" id="pfPrice" type="number" placeholder="قیمت (تومان)" value="${product?product.price:''}">
        <input class="field" id="pfDiscount" type="number" placeholder="قیمت با تخفیف (اختیاری)" value="${product&&product.discount_price!=null?product.discount_price:''}">
      </div>
      <select class="field" id="pfCategory" style="margin-bottom:8px;">
        <option value="">بدون دسته‌بندی</option>${catOptions}
      </select>
      <input class="field" id="pfTorob" placeholder="لینک خرید از ترب (خالی = دکمه غیرفعال)" dir="ltr" value="${product?product.torob_link||'':''}" style="margin-bottom:8px; text-align:left;">
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#6b7280; margin-bottom:10px;">
        <input type="checkbox" id="pfTop" ${product&&product.is_top?'checked':''} style="width:16px;height:16px;">
        ⭐ محصول ویژه (Top) — اول صفحه اصلی نمایش داده شود
      </label>
      <label class="small">تصاویر محصول (می‌توانید چند عکس با هم انتخاب کنید)</label>
      <input type="file" id="pfImages" accept="image/*" multiple style="margin-bottom:10px;">
      <div id="pfImageThumbs" class="image-thumbs-row"></div>
      <p class="err-text" id="pfErr" style="display:none;"></p>
      <div class="row-flex">
        <button class="btn-main" style="flex:1;" id="pfSaveBtn" onclick="saveProduct()">ذخیره</button>
        <button class="link-btn link-red" style="border:1px solid #fca5a5; border-radius:12px; padding:0 16px;" onclick="closeProductForm()">انصراف</button>
      </div>
    </div>`;
  renderImageThumbs();
}
function renderImageThumbs(){
  const el = document.getElementById('pfImageThumbs');
  if(!el) return;
  if(editingImages.length===0){ el.innerHTML=''; return; }
  el.innerHTML = editingImages.map((url,i)=>`
    <div class="thumb-chip">
      <img src="${url}">
      <button type="button" onclick="removeEditingImage(${i})">×</button>
    </div>`).join('');
}
function removeEditingImage(i){
  editingImages.splice(i,1);
  renderImageThumbs();
}
function closeProductForm(){ document.getElementById('productFormWrap').innerHTML=''; editingProduct=null; editingImages=[]; }

async function saveProduct(){
  const name = document.getElementById('pfName').value.trim();
  const price = document.getElementById('pfPrice').value;
  const errEl = document.getElementById('pfErr');
  if(!name || !price){ errEl.textContent='نام و قیمت الزامی است.'; errEl.style.display='block'; return; }

  const btn = document.getElementById('pfSaveBtn');
  btn.disabled = true; btn.textContent='در حال ذخیره...';

  const files = document.getElementById('pfImages').files;
  for(const file of files){
    const ext = file.name.split('.').pop();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
    const { error: upErr } = await supabaseClient.storage.from('product-images').upload(path, file);
    if(!upErr){
      const { data } = supabaseClient.storage.from('product-images').getPublicUrl(path);
      editingImages.push(data.publicUrl);
    }
  }

  const payload = {
    name,
    description: document.getElementById('pfDesc').value.trim(),
    price: Number(price),
    discount_price: document.getElementById('pfDiscount').value ? Number(document.getElementById('pfDiscount').value) : null,
    category_id: document.getElementById('pfCategory').value || null,
    torob_link: document.getElementById('pfTorob').value.trim() || null,
    is_top: document.getElementById('pfTop').checked,
    images: editingImages,
    image_url: editingImages[0] || null
  };

  if(editingProduct){
    await supabaseClient.from('products').update(payload).eq('id', editingProduct.id);
  } else {
    await supabaseClient.from('products').insert(payload);
  }
  closeProductForm();
  renderProducts();
}

async function deleteProduct(id){
  if(!confirm('این محصول حذف شود؟')) return;
  await supabaseClient.from('products').delete().eq('id', id);
  renderProducts();
}

// ---------- ORDERS ----------
function orderStatusBadge(status){
  if(status==='shipped') return `<span class="order-status shipped">📦 ارسال شده</span>`;
  if(status==='confirmed') return `<span class="order-status confirmed">✅ تایید شده</span>`;
  return `<span class="order-status pending">⏳ منتظر تایید فروشنده</span>`;
}

async function renderOrders(){
  const el = document.getElementById('tabContent');
  el.innerHTML = `<h2 class="section-title">سفارش‌ها</h2><div id="ordersWrap" class="muted">در حال بارگذاری...</div>`;
  const { data } = await supabaseClient.from('orders').select('*').order('created_at',{ascending:false});
  const wrap = document.getElementById('ordersWrap');
  if(!data || data.length===0){ wrap.innerHTML='<p class="muted">سفارشی ثبت نشده.</p>'; return; }
  wrap.innerHTML = data.map(o=>{
    const status = o.status || 'pending';
    let actionHtml = '';
    if(status==='pending'){
      actionHtml = `<button class="link-btn link-purple" style="margin-top:6px;" onclick="toggleOrderStatus('${o.id}','confirmed')">✔️ تایید سفارش</button>`;
    } else if(status==='confirmed'){
      actionHtml = `
        <div class="row-flex-2" style="margin-top:8px;">
          <input class="field" id="trkInput-${o.id}" placeholder="کد رهگیری پستی" dir="ltr" style="text-align:left;" value="${o.tracking_code||''}">
        </div>
        <div style="display:flex; gap:10px; margin-top:6px;">
          <button class="link-btn link-purple" onclick="shipOrder('${o.id}')">📦 ثبت کد رهگیری و ارسال</button>
          <button class="link-btn link-red" onclick="toggleOrderStatus('${o.id}','pending')">بازگشت به انتظار</button>
        </div>`;
    } else {
      actionHtml = `
        ${o.tracking_code?`<p class="item-sub" style="color:#1e40af;font-weight:700;" dir="ltr">کد رهگیری: ${o.tracking_code}</p>`:''}
        <button class="link-btn link-red" style="margin-top:6px;" onclick="toggleOrderStatus('${o.id}','confirmed')">بازگشت به حالت تایید شده</button>`;
    }
    return `
    <div class="card-white" style="margin-bottom:8px; padding:12px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <b style="font-size:13.5px;">${o.customer_name}</b>
        <button class="link-btn link-red" onclick="deleteOrder('${o.id}')">حذف</button>
      </div>
      ${orderStatusBadge(status)}
      ${o.order_code?`<p class="item-sub" style="color:#db2777;font-weight:700;" dir="ltr">${o.order_code}</p>`:''}
      <p class="item-sub">محصول: ${o.product_name||'—'} · تعداد: ${o.quantity}</p>
      <p class="item-sub" dir="ltr">${o.phone||''}</p>
      <p class="item-sub">${[o.province,o.city].filter(Boolean).join(' - ')}</p>
      <p class="item-sub">${o.address||''}${o.plate?` · پلاک ${o.plate}`:''}${o.unit?` · واحد ${o.unit}`:''}</p>
      ${o.postal_code?`<p class="item-sub" dir="ltr">کد پستی: ${o.postal_code}</p>`:''}
      ${actionHtml}
    </div>`;
  }).join('');
}
async function toggleOrderStatus(id, newStatus){
  await supabaseClient.from('orders').update({ status: newStatus }).eq('id', id);
  renderOrders();
}
async function shipOrder(id){
  const val = document.getElementById(`trkInput-${id}`).value.trim();
  if(!val){ alert('لطفاً کد رهگیری پستی را وارد کنید.'); return; }
  await supabaseClient.from('orders').update({ status: 'shipped', tracking_code: val }).eq('id', id);
  renderOrders();
}
async function deleteOrder(id){
  if(!confirm('این سفارش حذف شود؟')) return;
  await supabaseClient.from('orders').delete().eq('id', id);
  renderOrders();
}

// ---------- COMMENTS ----------
async function renderComments(){
  const el = document.getElementById('tabContent');
  el.innerHTML = `<h2 class="section-title">نظرات کاربران</h2><div id="commentsAdminWrap" class="muted">در حال بارگذاری...</div>`;

  const [{ data: comments }, { data: products }] = await Promise.all([
    supabaseClient.from('comments').select('*').order('created_at', { ascending:false }),
    supabaseClient.from('products').select('id,name')
  ]);
  const wrap = document.getElementById('commentsAdminWrap');
  if(!comments || comments.length===0){ wrap.innerHTML = '<p class="muted">نظری ثبت نشده.</p>'; return; }

  const productNameOf = (id) => (products||[]).find(p=>p.id===id)?.name || '—';

  const pending = comments.filter(c=>!c.approved);
  const approved = comments.filter(c=>c.approved);

  function commentRow(c){
    return `
    <div class="card-white" style="margin-bottom:8px; padding:12px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <b style="font-size:13.5px;">${c.name}</b>
        <button class="link-btn link-red" onclick="deleteComment('${c.id}')">حذف</button>
      </div>
      <p class="item-sub">محصول: ${productNameOf(c.product_id)}</p>
      <p style="font-size:13px; color:#374151; margin:6px 0;">${c.comment}</p>
      ${c.approved
        ? `<button class="link-btn link-red" onclick="setCommentApproval('${c.id}', false)">لغو تایید</button>`
        : `<button class="link-btn link-purple" onclick="setCommentApproval('${c.id}', true)">✔️ تایید و نمایش</button>`}
    </div>`;
  }

  wrap.innerHTML = `
    ${pending.length ? `<h3 style="font-size:13px;color:#b45309;margin:0 0 8px;">⏳ در انتظار تایید (${pending.length})</h3>${pending.map(commentRow).join('')}` : ''}
    ${approved.length ? `<h3 style="font-size:13px;color:#15803d;margin:16px 0 8px;">✅ تایید شده (${approved.length})</h3>${approved.map(commentRow).join('')}` : ''}
  `;
}
async function setCommentApproval(id, approved){
  await supabaseClient.from('comments').update({ approved }).eq('id', id);
  renderComments();
  refreshPendingBadge();
}
async function deleteComment(id){
  if(!confirm('این نظر حذف شود؟')) return;
  await supabaseClient.from('comments').delete().eq('id', id);
  renderComments();
  refreshPendingBadge();
}

// ---------- ADMINS ----------
async function renderAdmins(){
  const el = document.getElementById('tabContent');
  el.innerHTML = `<h2 class="section-title">مدیریت دسترسی ادمین‌ها</h2>
    <p class="hint">کاربر باید ابتدا از بخش Authentication در Supabase ساخته شده باشد، سپس ایمیلش اینجا اضافه شود.</p>
    <div class="row-flex" style="margin-bottom:14px;">
      <input class="field" id="adminEmail" placeholder="ایمیل کاربر" dir="ltr" style="text-align:left;">
      <button class="btn-main" style="padding:0 20px;" onclick="addAdmin()">افزودن</button>
    </div>
    <p class="err-text" id="adminErr" style="display:none;"></p>
    <div id="adminListWrap" class="muted">در حال بارگذاری...</div>`;
  loadAdminList();
}
async function loadAdminList(){
  const { data } = await supabaseClient.from('admin_users').select('*').order('created_at');
  const el = document.getElementById('adminListWrap');
  if(!data || data.length===0){ el.innerHTML='<p class="muted">مدیری ثبت نشده.</p>'; return; }
  el.innerHTML = data.map(a=>`
    <div class="list-item">
      <div style="flex:1;"><p class="item-title" dir="ltr">${a.email}</p></div>
      <button class="link-btn link-red" onclick="removeAdmin('${a.id}','${a.email}')">حذف دسترسی</button>
    </div>`).join('');
}
async function addAdmin(){
  const input = document.getElementById('adminEmail');
  const errEl = document.getElementById('adminErr');
  errEl.style.display='none';
  if(!input.value.trim()) return;
  const { error } = await supabaseClient.from('admin_users').insert({ email: input.value.trim().toLowerCase() });
  if(error){ errEl.textContent='این ایمیل قبلاً اضافه شده یا خطایی رخ داد.'; errEl.style.display='block'; return; }
  input.value='';
  loadAdminList();
}
async function removeAdmin(id, email){
  if(email === currentSession.user.email){ alert('نمی‌توانید دسترسی خودتان را حذف کنید.'); return; }
  if(!confirm('دسترسی این مدیر حذف شود؟')) return;
  await supabaseClient.from('admin_users').delete().eq('id', id);
  loadAdminList();
}

  const cleanFooter = (s.footer_text||'').replace(/[.·\s]*ساخته شده توسط امیرحسین سرافراز[.\s]*/g,'').trim();
  document.getElementById('settingsWrap').innerHTML = `

      <input class="field" id="stEmail" dir="ltr" style="text-align:left; margin-bottom:12px;" value="${s.complaint_email||''}" placeholder="example@gmail.com">

      <label class="small">آیدی روبیکا (بدون @ و بدون لینک کامل)</label>
      <input class="field" id="stRubika" dir="ltr" style="text-align:left; margin-bottom:4px;" value="${s.rubika_username||''}" placeholder="Lalune1999">
      <p class="hint" style="margin-bottom:12px;">همین آیدی برای دکمه «پرداخت و تایید سفارش» و دکمه روبیکا پایین سایت استفاده می‌شود.</p>

      <label class="small">لینک پیج اینستاگرام</label>
      <input class="field" id="stInstagram" dir="ltr" style="text-align:left; margin-bottom:12px;" value="${s.instagram_link||''}" placeholder="https://www.instagram.com/username">

      <label class="small">لینک لوکیشن فروشگاه (نشان، گوگل مپ یا هر لینک دیگر)</label>
      <input class="field" id="stLocation" dir="ltr" style="text-align:left; margin-bottom:12px;" value="${s.location_link||''}" placeholder="https://...">

      <button class="btn-main" id="stSaveBtn" onclick="saveSettings()">ذخیره تغییرات</button>
    </div>`;
}
async function saveSettings(){
  const btn = document.getElementById('stSaveBtn');
  btn.disabled=true; btn.textContent='در حال ذخیره...';
  await supabaseClient.from('site_settings').update({
    about_text: document.getElementById('stAbout').value,
    complaint_email: document.getElementById('stEmail').value.trim(),
    rubika_username: document.getElementById('stRubika').value.trim().replace(/^@/,''),
    instagram_link: document.getElementById('stInstagram').value.trim(),
    location_link: document.getElementById('stLocation').value.trim(),
    footer_text: document.getElementById('stFooter').value.trim()
  }).eq('id',1);
  btn.disabled=false; btn.textContent='✓ ذخیره شد';
  setTimeout(()=>{ btn.textContent='ذخیره تغییرات'; }, 2000);
}

init();
