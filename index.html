<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>آرایشی بهداشتی بابک</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="splash-active">

<div class="splash" id="splashScreen">
  <img src="assets/logo.png" alt="آرایشی بهداشتی بابک" />
  <span class="splash-title">آرایشی بهداشتی بابک</span>
</div>

<header class="header">
  <div class="header-inner">
    <button class="burger-btn" onclick="openDrawer()">☰</button>
    <a href="index.html" class="title-group">
      <img src="assets/logo.png" class="header-logo" alt="لوگو" />
      <span class="site-title">آرایشی بهداشتی بابک</span>
    </a>
    <span style="width:28px"></span>
  </div>
</header>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<nav class="drawer" id="drawer">
  <div class="drawer-head">
    <span>منو</span>
    <button class="drawer-close" onclick="closeDrawer()">×</button>
  </div>
  <a href="index.html">🏠 خانه</a>
  <button class="drawer-cat-btn" onclick="toggleCats()">🗂️ دسته‌بندی‌ها</button>
  <div class="cat-list" id="catList"></div>
  <a href="about.html">ℹ️ درباره ما</a>
  <div style="margin-top:auto; padding-top:16px; border-top:1px solid #f3f4f6; text-align:center;">
    <a href="admin.html" style="font-size:12px; color:#9ca3af;">ورود مدیریت</a>
  </div>
</nav>

<section class="hero entrance">
  <h1>آرایشی بهداشتی بابک</h1>
  <p>محصولات اورجینال آرایشی و بهداشتی با بهترین کیفیت و قیمت</p>
</section>

<div class="container">
  <div class="chips entrance" id="chips" style="display:none;"></div>
  <div id="productArea"><p class="empty-text">در حال بارگذاری...</p></div>
</div>

<footer class="footer" id="footerArea">
  <p class="brand">آرایشی بهداشتی بابک</p>
</footer>

<div id="modalArea"></div>

<script src="config.js"></script>
<script>
let allProducts = [];
let categories = [];
let activeCategory = null;

function openDrawer(){ document.getElementById('drawer').classList.add('open'); document.getElementById('drawerOverlay').classList.add('open'); document.body.style.overflow='hidden'; }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('drawerOverlay').classList.remove('open'); document.body.style.overflow=''; }
function toggleCats(){ document.getElementById('catList').classList.toggle('open'); }

function formatPrice(n){ return Number(n).toLocaleString('fa-IR') + ' تومان'; }

async function loadEverything(){
  const [{data: cats}, {data: prods}, {data: settings}] = await Promise.all([
    supabaseClient.from('categories').select('*').order('created_at'),
    supabaseClient.from('products').select('*').order('created_at', {ascending:false}),
    supabaseClient.from('site_settings').select('*').eq('id',1).maybeSingle()
  ]);
  categories = cats || [];
  allProducts = prods || [];
  renderDrawerCats();
  renderChips();
  renderProducts();
  renderFooter(settings);
}

function renderDrawerCats(){
  const el = document.getElementById('catList');
  if(categories.length===0){ el.innerHTML = '<span style="font-size:13px;color:#d1d5db;padding:8px 10px;display:block;">دسته‌بندی‌ای ثبت نشده</span>'; return; }
  el.innerHTML = categories.map(c => `<a href="#" onclick="filterCategory('${c.id}');closeDrawer();return false;">${c.name}</a>`).join('');
}

function renderChips(){
  const el = document.getElementById('chips');
  if(categories.length===0){ el.style.display='none'; return; }
  el.style.display='flex';
  el.innerHTML = `<button class="chip ${!activeCategory?'active':''}" onclick="filterCategory(null)">همه محصولات</button>` +
    categories.map(c => `<button class="chip ${activeCategory===c.id?'active':''}" onclick="filterCategory('${c.id}')">${c.name}</button>`).join('');
}

function filterCategory(id){
  activeCategory = id;
  renderChips();
  renderProducts();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderProducts(){
  const el = document.getElementById('productArea');
  const list = activeCategory ? allProducts.filter(p=>p.category_id===activeCategory) : allProducts;
  if(list.length===0){ el.innerHTML = '<p class="empty-text">محصولی برای نمایش وجود ندارد.</p>'; return; }
  el.innerHTML = `<div class="grid">${list.map(p=>productCard(p)).join('')}</div>`;
}

function productCard(p){
  const hasDiscount = p.discount_price != null && Number(p.discount_price) < Number(p.price);
  const priceHtml = hasDiscount
    ? `<span class="price-now">${formatPrice(p.discount_price)}</span><span class="price-old">${formatPrice(p.price)}</span>`
    : `<span class="price-plain">${formatPrice(p.price)}</span>`;
  const torobHtml = p.torob_link
    ? `<a class="btn-torob" href="${p.torob_link}" target="_blank" rel="noopener">خرید از ترب</a>`
    : `<span class="btn-torob disabled">خرید از ترب</span>`;
  const img = p.image_url ? `<img src="${p.image_url}" alt="${p.name}">` : '💄';
  return `
    <div class="card entrance">
      <div class="card-img">${img}</div>
      <div class="card-body">
        <p class="card-title">${p.name}</p>
        ${p.description ? `<p class="card-desc">${p.description}</p>` : ''}
        <div class="price-row">${priceHtml}</div>
        <div class="btn-row">
          <button class="btn-order" onclick='openOrderModal(${JSON.stringify(p.id)}, ${JSON.stringify(p.name)})'>ثبت سفارش</button>
          ${torobHtml}
        </div>
      </div>
    </div>`;
}

function renderFooter(settings){
  const s = settings || {};
  const footerText = s.footer_text || 'کلیه حقوق سایت آرایشی بهداشتی بابک محفوظ است. ساخته شده توسط امیرحسین سرافراز';
  const complaintEmail = s.complaint_email || '';
  document.getElementById('footerArea').innerHTML = `
    <p class="brand">آرایشی بهداشتی بابک</p>
    ${complaintEmail ? `<a class="complaint-btn" href="mailto:${complaintEmail}?subject=${encodeURIComponent('شکایات و پیشنهادات')}">✉️ ثبت شکایات و پیشنهادات</a>` : ''}
    <p class="footer-text">${footerText}</p>
  `;
}

function openOrderModal(productId, productName){
  document.getElementById('modalArea').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeOrderModal()">
      <div class="modal-box entrance">
        <div class="modal-head">
          <b>ثبت سفارش: ${productName}</b>
          <button class="modal-close" onclick="closeOrderModal()">×</button>
        </div>
        <div id="orderFormArea">
          <input class="field" id="ordName" placeholder="نام و نام خانوادگی" />
          <input class="field" id="ordPhone" placeholder="شماره تماس" inputmode="numeric" />
          <textarea class="field" id="ordAddress" placeholder="آدرس (اختیاری)" rows="2"></textarea>
          <div class="qty-row">تعداد <input class="field" style="margin:0" type="number" min="1" value="1" id="ordQty"></div>
          <p class="err-text" id="ordErr" style="display:none;"></p>
          <button class="submit-btn" id="ordSubmitBtn" onclick="submitOrder('${productId}', '${productName.replace(/'/g,"\\'")}')">ثبت نهایی سفارش</button>
        </div>
      </div>
    </div>`;
}

function closeOrderModal(){ document.getElementById('modalArea').innerHTML = ''; }

async function submitOrder(productId, productName){
  const name = document.getElementById('ordName').value.trim();
  const phone = document.getElementById('ordPhone').value.trim();
  const address = document.getElementById('ordAddress').value.trim();
  const quantity = Math.max(1, Number(document.getElementById('ordQty').value) || 1);
  const errEl = document.getElementById('ordErr');
  if(!name || !phone){ errEl.textContent = 'نام و شماره تماس الزامی است.'; errEl.style.display='block'; return; }

  const btn = document.getElementById('ordSubmitBtn');
  btn.disabled = true; btn.textContent = 'در حال ثبت...';

  const { error } = await supabaseClient.from('orders').insert({
    product_id: productId, product_name: productName,
    customer_name: name, phone, address, quantity
  });

  if(error){
    errEl.textContent = 'خطا در ثبت سفارش، دوباره تلاش کنید.';
    errEl.style.display='block';
    btn.disabled=false; btn.textContent='ثبت نهایی سفارش';
    return;
  }

  document.getElementById('orderFormArea').innerHTML = `
    <div class="success-box">
      <div style="font-size:38px;">✅</div>
      <p style="font-weight:800;color:#7c3aed;">سفارش شما ثبت شد</p>
      <p style="font-size:13px;color:#9ca3af;">به‌زودی با شما تماس گرفته می‌شود.</p>
      <button class="submit-btn" onclick="closeOrderModal()">متوجه شدم</button>
    </div>`;
}

function hideSplash(){
  const splash = document.getElementById('splashScreen');
  if(!splash) return;
  splash.classList.add('hide');
  document.body.classList.remove('splash-active');
  setTimeout(()=>{ splash.remove(); }, 550);
}

loadEverything();
setTimeout(hideSplash, 1300);
</script>
</body>
</html>
