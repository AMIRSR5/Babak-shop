<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>آرایشی بهداشتی بابک</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js" defer></script>
</head>
<body class="splash-active">

<div class="splash" id="splashScreen">
  <img src="logo.png" alt="آرایشی بهداشتی بابک" onerror="this.style.display='none'" />
  <span class="splash-title">آرایشی بهداشتی بابک</span>
  <span class="splash-tagline">Là Lune 🌛</span>
</div>

<header class="header">
  <div class="header-inner">
    <button class="burger-btn" onclick="openDrawer()">☰</button>
    <a href="index.html" class="title-group" onclick="return goHome(event)">
      <img src="logo.png" class="header-logo" alt="لوگو" onerror="this.style.display='none'" />
      <span class="title-col">
        <span class="site-title">آرایشی بهداشتی بابک</span>
        <span class="site-tagline">Là Lune 🌛</span>
      </span>
    </a>
    <button class="dark-toggle-btn" id="darkToggleBtn" onclick="toggleDarkMode()">🌙</button>
  </div>
</header>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<nav class="drawer" id="drawer">
  <div class="drawer-head">
    <span>منو</span>
    <button class="drawer-close" onclick="closeDrawer()">×</button>
  </div>
  <a href="index.html" onclick="return goHome(event)">🏠 خانه</a>
  <button class="drawer-cat-btn" onclick="toggleCats()">🗂️ دسته‌بندی‌ها</button>
  <div class="cat-list" id="catList"></div>
  <a href="about.html">ℹ️ درباره ما</a>
  <a href="track.html">📦 پیگیری سفارش</a>
  <a href="login.html" id="authMenuLink">👤 ورود / ثبت‌نام</a>
</nav>

<section class="hero entrance">
  <h1>آرایشی بهداشتی بابک</h1>
  <p>محصولات اورجینال آرایشی و بهداشتی با بهترین کیفیت و قیمت</p>
</section>

<div class="container">
  <div class="chips entrance" id="chips" style="display:none;"></div>
  <div id="productArea"><p class="empty-text">در حال بارگذاری...</p></div>
</div>

<footer class="footer" id="footerArea">
  <p class="brand">آرایشی بهداشتی بابک</p>
</footer>

<div id="modalArea"></div>

<script src="config.js"></script>
<script>
let allProducts = [];
let categories = [];
let activeCategory = null;
let siteSettings = {};
let currentUser = null;

function formatPrice(n){ return Number(n).toLocaleString('fa-IR') + ' تومان'; }

async function initAuth(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentUser = session?.user || null;
  updateAuthUI();
  maybeResumePendingOrder();

  supabaseClient.auth.onAuthStateChange((_e, session) => {
    currentUser = session?.user || null;
    updateAuthUI();
  });
}

function updateAuthUI(){
  const el = document.getElementById('authMenuLink');
  if(!el) return;
  if(currentUser){
    el.textContent = `🚪 خروج (${currentUser.email})`;
    el.href = '#';
    el.onclick = async (e) => { e.preventDefault(); await supabaseClient.auth.signOut(); location.reload(); };
  } else {
    el.textContent = '👤 ورود / ثبت‌نام';
    el.href = 'login.html';
    el.onclick = null;
  }
}

function maybeResumePendingOrder(){
  const raw = sessionStorage.getItem('pendingOrder');
  if(raw && currentUser){
    sessionStorage.removeItem('pendingOrder');
    try{
      const { productId, productName } = JSON.parse(raw);
      openOrderModal(productId, productName, true);
    }catch(e){}
  }
}

async function loadEverything(){
  const [{data: cats}, {data: prods}, {data: settings}] = await Promise.all([
    supabaseClient.from('categories').select('*').order('created_at'),
    supabaseClient.from('products').select('*').order('created_at', {ascending:false}),
    supabaseClient.from('site_settings').select('*').eq('id',1).maybeSingle()
  ]);
  categories = cats || [];
  allProducts = prods || [];
  siteSettings = settings || {};
  renderDrawerCats();
  renderChips();
  renderProducts();
  renderFooter(siteSettings);
}

function renderDrawerCats(){
  const el = document.getElementById('catList');
  if(categories.length===0){ el.innerHTML = '<span style="font-size:13px;color:#d1d5db;padding:8px 10px;display:block;">دسته‌بندی‌ای ثبت نشده</span>'; return; }
  el.innerHTML = categories.map(c => `<a href="#" onclick="filterCategory('${c.id}');return false;">${c.name}</a>`).join('');
}

function renderChips(){
  const el = document.getElementById('chips');
  if(categories.length===0){ el.style.display='none'; return; }
  el.style.display='flex';
  el.innerHTML = `<button class="chip" onclick="filterCategory(null)">همه محصولات</button>` +
    categories.map(c => `<button class="chip" onclick="filterCategory('${c.id}')">${c.name}</button>`).join('');
}

function filterCategory(id){
  closeDrawer();
  const target = id ? document.getElementById('cat-'+id) : null;
  if(target){ target.scrollIntoView({behavior:'smooth', block:'start'}); }
  else { window.scrollTo({top:0, behavior:'smooth'}); }
}

function renderProducts(){
  const el = document.getElementById('productArea');
  if(allProducts.length===0){ el.innerHTML = '<p class="empty-text">محصولی برای نمایش وجود ندارد.</p>'; return; }

  const topProducts = allProducts.filter(p=>p.is_top);
  const topIds = new Set(topProducts.map(p=>p.id));
  let html = '';

  if(topProducts.length>0){
    html += `<div class="section-block entrance">
      <h2 class="section-heading">⭐ محصولات ویژه</h2>
      <div class="grid">${topProducts.map(p=>productCard(p)).join('')}</div>
    </div>`;
  }

  categories.forEach(c=>{
    const items = allProducts.filter(p=>p.category_id===c.id && !topIds.has(p.id));
    if(items.length===0) return;
    html += `<div class="section-block entrance" id="cat-${c.id}">
      <h2 class="section-heading">${c.name}</h2>
      <div class="grid">${items.map(p=>productCard(p)).join('')}</div>
    </div>`;
  });

  const otherItems = allProducts.filter(p=>!p.category_id && !topIds.has(p.id));
  if(otherItems.length>0){
    html += `<div class="section-block entrance">
      <h2 class="section-heading">سایر محصولات</h2>
      <div class="grid">${otherItems.map(p=>productCard(p)).join('')}</div>
    </div>`;
  }

  el.innerHTML = html || '<p class="empty-text">محصولی برای نمایش وجود ندارد.</p>';
}

function productCard(p){
  const hasDiscount = p.discount_price != null && Number(p.discount_price) < Number(p.price);
  const priceHtml = hasDiscount
    ? `<span class="price-now">${formatPrice(p.discount_price)}</span><span class="price-old">${formatPrice(p.price)}</span>`
    : `<span class="price-plain">${formatPrice(p.price)}</span>`;
  const torobHtml = p.torob_link
    ? `<a class="btn-torob" href="${p.torob_link}" target="_blank" rel="noopener">خرید از ترب</a>`
    : `<span class="btn-torob disabled">خرید از ترب</span>`;
  const thumb = (p.images && p.images.length) ? p.images[0] : p.image_url;
  const img = thumb ? `<img src="${thumb}" alt="${p.name}" loading="lazy">` : '💄';
  return `
    <div class="card entrance">
      <div class="card-img">${p.is_top?'<span class="top-badge">⭐ ویژه</span>':''}${img}</div>
      <div class="card-body">
        <p class="card-title">${p.name}</p>
        ${p.description ? `<p class="card-desc">${p.description}</p>` : ''}
        <div class="price-row">${priceHtml}</div>
        <button class="detail-link" onclick="openProductDetail('${p.id}')">💬 جزئیات و نظرات</button>
        <div class="btn-row">
          <button class="btn-order" onclick='openOrderModal(${JSON.stringify(p.id)}, ${JSON.stringify(p.name)})'>ثبت سفارش</button>
          ${torobHtml}
        </div>
      </div>
    </div>`;
}

async function openProductDetail(id){
  const p = allProducts.find(x=>x.id===id);
  if(!p) return;
  const { data: comments } = await supabaseClient.from('comments').select('*').eq('product_id', id).eq('approved', true).order('created_at',{ascending:false});
  const hasDiscount = p.discount_price != null && Number(p.discount_price) < Number(p.price);
  const priceHtml = hasDiscount
    ? `<span class="price-now">${formatPrice(p.discount_price)}</span><span class="price-old">${formatPrice(p.price)}</span>`
    : `<span class="price-plain">${formatPrice(p.price)}</span>`;
  const torobHtml = p.torob_link
    ? `<a class="btn-torob" href="${p.torob_link}" target="_blank" rel="noopener">خرید از ترب</a>`
    : `<span class="btn-torob disabled">خرید از ترب</span>`;

  const gallery = (p.images && p.images.length) ? p.images : (p.image_url ? [p.image_url] : []);

  document.getElementById('modalArea').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeDetailModal()">
      <div class="modal-box entrance">
        <div class="modal-head">
          <b>${p.name}</b>
          <button class="modal-close" onclick="closeDetailModal()">×</button>
        </div>
        <div class="detail-img" id="detailMainImg">${gallery[0]?`<img src="${gallery[0]}" alt="${p.name}">`:'💄'}</div>
        ${gallery.length>1 ? `<div class="detail-thumbs">${gallery.map((url,i)=>`<button class="detail-thumb ${i===0?'active':''}" onclick="switchDetailImage(this,'${url}')"><img src="${url}"></button>`).join('')}</div>` : ''}
        ${p.description?`<p class="detail-desc">${p.description}</p>`:''}
        <div class="price-row" style="margin:10px 0;">${priceHtml}</div>
        <div class="btn-row">
          <button class="btn-order" onclick='closeDetailModal();openOrderModal(${JSON.stringify(p.id)}, ${JSON.stringify(p.name)})'>ثبت سفارش</button>
          ${torobHtml}
        </div>

        <hr class="detail-sep">
        <h3 class="detail-comments-title">نظرات کاربران</h3>
        <div id="commentsList">${renderComments(comments||[])}</div>

        <div class="comment-form">
          <input class="field" id="cmName" placeholder="نام شما" style="margin-bottom:8px;">
          <textarea class="field" id="cmText" placeholder="نظر شما..." rows="2" style="margin-bottom:8px;"></textarea>
          <p class="err-text" id="cmErr" style="display:none;"></p>
          <button class="submit-btn" id="cmBtn" onclick="submitComment('${p.id}')">ثبت نظر</button>
          <p style="font-size:11px;color:#9ca3af;margin-top:6px;">نظر شما پس از تایید ادمین نمایش داده می‌شود.</p>
        </div>
      </div>
    </div>`;
}
function closeDetailModal(){ document.getElementById('modalArea').innerHTML=''; }

function switchDetailImage(btn, url){
  document.getElementById('detailMainImg').innerHTML = `<img src="${url}" alt="">`;
  document.querySelectorAll('.detail-thumb').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
}

function renderComments(list){
  if(list.length===0) return '<p class="empty-text" style="padding:16px 0;">هنوز نظری ثبت نشده.</p>';
  return list.map(c=>`<div class="comment-item"><b>${c.name}</b><p>${c.comment}</p></div>`).join('');
}

async function submitComment(productId){
  const name = document.getElementById('cmName').value.trim();
  const text = document.getElementById('cmText').value.trim();
  const errEl = document.getElementById('cmErr');
  errEl.style.display='none';
  if(!name || !text){ errEl.textContent='نام و متن نظر الزامی است.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('cmBtn');
  btn.disabled=true; btn.textContent='در حال ارسال...';
  const { error } = await supabaseClient.from('comments').insert({ product_id: productId, name, comment: text, approved:false });
  btn.disabled=false; btn.textContent='ثبت نظر';
  if(error){ errEl.textContent='خطا در ثبت نظر.'; errEl.style.display='block'; return; }
  document.getElementById('cmName').value='';
  document.getElementById('cmText').value='';
  alert('نظر شما ثبت شد و پس از تایید ادمین نمایش داده می‌شود.');
}

function renderFooter(settings){
  const s = settings || {};
  let footerText = s.footer_text || 'کلیه حقوق سایت آرایشی بهداشتی بابک محفوظ است.';
  footerText = footerText.replace(/[.·\s]*ساخته شده توسط امیرحسین سرافراز[.\s]*/g, '').trim();
  const complaintEmail = s.complaint_email || '';
  const instagramLink = s.instagram_link || '';
  const rubikaUsername = s.rubika_username || 'Lalune1999';
  document.getElementById('footerArea').innerHTML = `
    <p class="brand">آرایشی بهداشتی بابک</p>
    <div class="social-row">
      ${instagramLink ? `<a class="social-btn" href="${instagramLink}" target="_blank" rel="noopener">📸 اینستاگرام</a>` : ''}
      <a class="social-btn" href="https://rubika.ir/${rubikaUsername}" target="_blank" rel="noopener">💬 روبیکا</a>
    </div>
    ${complaintEmail ? `<a class="complaint-btn" href="mailto:${complaintEmail}?subject=${encodeURIComponent('شکایات و پیشنهادات')}">✉️ ثبت شکایات و پیشنهادات</a>` : ''}
    <p class="footer-text">${footerText}</p>
    <p class="footer-text" style="opacity:.75;">ساخته شده توسط امیرحسین سرافراز</p>
  `;
}

function openOrderModal(productId, productName, skipAuthCheck){
  if(!skipAuthCheck && !currentUser){
    sessionStorage.setItem('pendingOrder', JSON.stringify({ productId, productName }));
    location.href = 'login.html?redirect=index.html';
    return;
  }
  document.getElementById('modalArea').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeOrderModal()">
      <div class="modal-box entrance">
        <div class="modal-head">
          <b>ثبت سفارش: ${productName}</b>
          <button class="modal-close" onclick="closeOrderModal()">×</button>
        </div>
        <div id="orderFormArea">
          <input class="field" id="ordName" placeholder="نام و نام خانوادگی *" />
          <input class="field" id="ordPhone" placeholder="شماره تماس *" inputmode="numeric" />
          <div class="row-flex-2">
            <input class="field" id="ordProvince" placeholder="استان *" />
            <input class="field" id="ordCity" placeholder="شهر *" />
          </div>
          <textarea class="field" id="ordAddress" placeholder="آدرس کامل *" rows="2"></textarea>
          <div class="row-flex-2">
            <input class="field" id="ordPlate" placeholder="پلاک *" />
            <input class="field" id="ordUnit" placeholder="واحد *" />
          </div>
          <input class="field" id="ordPostal" placeholder="کد پستی *" inputmode="numeric" />
          <div class="qty-row">تعداد <input class="field" style="margin:0" type="number" min="1" value="1" id="ordQty"></div>
          <p class="err-text" id="ordErr" style="display:none;"></p>
          <button class="submit-btn" id="ordSubmitBtn" onclick="submitOrder('${productId}', '${productName.replace(/'/g,"\\'")}')">ثبت نهایی سفارش</button>
        </div>
      </div>
    </div>`;
}

function closeOrderModal(){ document.getElementById('modalArea').innerHTML = ''; }

function makeOrderCode(){
  return 'BB-' + Math.random().toString(36).slice(2,8).toUpperCase();
}

async function submitOrder(productId, productName){
  const name = document.getElementById('ordName').value.trim();
  const phone = document.getElementById('ordPhone').value.trim();
  const province = document.getElementById('ordProvince').value.trim();
  const city = document.getElementById('ordCity').value.trim();
  const address = document.getElementById('ordAddress').value.trim();
  const plate = document.getElementById('ordPlate').value.trim();
  const unit = document.getElementById('ordUnit').value.trim();
  const postal_code = document.getElementById('ordPostal').value.trim();
  const quantity = Math.max(1, Number(document.getElementById('ordQty').value) || 1);
  const errEl = document.getElementById('ordErr');

  if(!name || !phone || !province || !city || !address || !plate || !unit || !postal_code){
    errEl.textContent = 'پر کردن همه فیلدهای ستاره‌دار الزامی است.';
    errEl.style.display='block';
    return;
  }

  const btn = document.getElementById('ordSubmitBtn');
  btn.disabled = true; btn.textContent = 'در حال ثبت...';

  const order_code = makeOrderCode();

  const { error } = await supabaseClient.from('orders').insert({
    product_id: productId, product_name: productName,
    customer_name: name, phone, province, city, address, plate, unit, postal_code,
    quantity, order_code, status: 'pending',
    customer_id: currentUser?.id || null, customer_email: currentUser?.email || null
  });

  if(error){
    errEl.textContent = 'خطا در ثبت سفارش، دوباره تلاش کنید.';
    errEl.style.display='block';
    btn.disabled=false; btn.textContent='ثبت نهایی سفارش';
    return;
  }

  document.getElementById('orderFormArea').innerHTML = `
    <div class="success-box">
      <div style="font-size:38px;">✅</div>
      <p style="font-weight:800;color:#7c3aed;">سفارش شما ثبت شد</p>
      <div class="order-code-box">
        <span>کد سفارش شما</span>
        <b dir="ltr">${order_code}</b>
      </div>
      <span class="order-status pending">⏳ منتظر تایید فروشنده</span>
      <button class="submit-btn" style="background:#0088cc;" onclick="confirmOnRubika('${order_code}')">پرداخت و تایید سفارش</button>
      <p style="font-size:11px;color:#9ca3af;margin-top:8px;">با کلیک روی دکمه بالا، کد سفارش کپی می‌شود و چت روبیکا برای هماهنگی پرداخت باز می‌شود. پس از پرداخت، فروشنده سفارش شما را تایید می‌کند.</p>
      <a class="submit-btn" style="background:#9333ea; display:block; text-align:center; margin-top:8px;" href="track.html?code=${order_code}">پیگیری وضعیت سفارش</a>
      <button class="submit-btn" style="background:#9ca3af; margin-top:8px;" onclick="closeOrderModal()">متوجه شدم</button>
    </div>`;
}

function confirmOnRubika(orderCode){
  const text = `کد سفارش من: ${orderCode}`;
  if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(()=>{}); }
  const username = siteSettings.rubika_username || 'Lalune1999';
  window.open(`https://rubika.ir/${username}`, '_blank');
}

function hideSplash(){
  const splash = document.getElementById('splashScreen');
  if(!splash) return;
  splash.classList.add('hide');
  document.body.classList.remove('splash-active');
  setTimeout(()=>{ splash.remove(); }, 550);
}

loadEverything();
initAuth();
setTimeout(hideSplash, 1300);
</script>
</body>
</html>
